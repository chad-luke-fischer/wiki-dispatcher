[project]
name = "wiki-dispatcher"
version = "0.1.0"
description = "A CLI-resident agent mounted to an llm-wiki style Obsidian vault: traverses context, tends a garden of self-evolving skills, and dispatches deliverables."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
dependencies = [
  "deepagents>=0.7.14",
  "langchain>=1.4.0",
  "langgraph>=1.2",
  "typer>=0.27",
  "rich>=15",
  "python-frontmatter>=1.3",
  "networkx>=3.6",
  "pyyaml>=6",
  "tiktoken>=0.14",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.7"]
openai = ["langchain-openai>=1.0"]
ollama = ["langchain-ollama>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wd = "wiki_dispatcher.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wiki_dispatcher*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
